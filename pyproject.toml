[project]
name = "wellprod"
version = "0.1.0"
description = "Production analytics over Argentina's official open per-well oil & gas dataset"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Lucas Arteaga", email = "larteaga@fi.uba.ar" }]
keywords = ["oil-and-gas", "petroleum-engineering", "production-data", "data-quality", "gor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
]

[project.scripts]
wellprod = "wellprod.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wellprod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "PTH"]

# The type-checker configuration lives in pyrightconfig.json. Tools read that file reliably
# when they invoke pyright themselves; the equivalent [tool.pyright] section is not picked up
# by all of them, and a checker that cannot resolve the environment produces false errors.

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pyright>=1.1.414",
  "pandas-stubs>=3.0.5",
]
