[project]
name = "wellprod"
version = "0.1.0"
description = "Production analytics over Argentina's official open per-well oil & gas dataset"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Lucas Arteaga", email = "larteaga@fi.uba.ar" }]
keywords = ["oil-and-gas", "petroleum-engineering", "production-data", "data-quality", "gor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wellprod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "PTH"]

[tool.pyright]
# The environment is managed by uv; point the type checker at the same interpreter
# the tests run under, otherwise every third-party import is reported as unresolved.
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.414",
]
